[project]

site_name = "Introdução à Topografia"
site_url = "https://255ribeiro.github.io/intro_topografia/"

repo_url = "https://github.com/255ribeiro/intro_topografia"
repo_name = "255ribeiro/intro_topografia"

site_description = "Anotações de aula para a disciplina de introdução à topografia"

site_author = "Fernando Ferraz Ribeiro"

copyright = """
Copyright &copy; 2026 The authors
"""

nav = [
  { "Get started" = "index.md" },
  {"Informações geográficas de salvador"="ssa_geo/ssa_geo.md"},
  # Qgis
  {"Qgis" = [
    {"Introdução" = "qgis/qgis.md"},
    {"Interface" = "qgis/qgis_interface.md"},
    {"Configuração de mapas do Google" = "qgis/qgis_xyz_google.md"},
    {"Configuração do servidor WFS de Salvador" = "qgis/Cartografica_PMS.md"},
    {"Recortar camada" = "qgis/qgis_recorte_shape.md"}
  ]},

#   Editais
  {"Editais" = [
    {"Edital Avaliação 01" = "Editais/edital_av1.md"},
    {"Edital Avaliação 02" = "Editais/edital_av2.md"},
  ]},
]

[project.theme]

variant = "classic"

language = "pt-BR"

features = [
    "announce.dismiss",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    # "navigation.indexes",   
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    # "navigation.prune", 
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]


[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"


[project.markdown_extensions]
    [project.markdown_extensions.toc]
    toc_depth = 1

# ----------------------------------------------------------------------------
# The "extra" section contains miscellaneous settings.
# ----------------------------------------------------------------------------
