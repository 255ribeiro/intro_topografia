<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="720"
   height="400"
   viewBox="0 0 720 400"
   version="1.1"
   id="svg28"
   sodipodi:docname="plataforma_mista.svg"
   inkscape:version="1.4 (86a8ad7, 2024-10-11)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview28"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.3664839"
     inkscape:cx="318.33526"
     inkscape:cy="243.32523"
     inkscape:window-width="1920"
     inkscape:window-height="991"
     inkscape:window-x="-9"
     inkscape:window-y="-9"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg28" />
  <title
     id="title1">Plataforma mista — talude de corte e talude de aterro simultâneos</title>
  <defs
     id="defs1">
    <marker
       id="arr"
       viewBox="0 0 10 10"
       refX="5"
       refY="5"
       markerWidth="4"
       markerHeight="4"
       orient="auto-start-reverse">
      <path
         d="M0 5 L10 5 M0 2 L0 8 M10 2 L10 8"
         fill="none"
         stroke="context-stroke"
         stroke-width="1.5"
         id="path1" />
    </marker>
    <!-- Hachura para indicar material escavado (corte) -->
    <pattern
       id="hatch"
       width="8"
       height="8"
       patternUnits="userSpaceOnUse"
       patternTransform="rotate(45)">
      <line
         x1="0"
         y1="0"
         x2="0"
         y2="8"
         stroke="#639922"
         stroke-width="0.8"
         opacity="0.5"
         id="line1" />
    </pattern>
  </defs>
  <!-- ============================================================
       Geometria calculada com terrain slope = (330-100)/720 per x
       Terrain: from (0,100) to (720,330) → y = 100 + 0.319·x
       Platform: y=210, x=220 to x=480
       Crista corte (interseção talude corte c/ terreno): (104, 133)
       Pé aterro (interseção talude aterro c/ terreno): (595, 290)
       ============================================================ -->
  <!-- Solo de fundação -->
  <rect
     x="0"
     y="350"
     width="720"
     height="50"
     fill="#97C459"
     fill-opacity="0.18"
     stroke="#639922"
     stroke-width="0.5"
     id="rect1" />
  <text
     font-family="sans-serif"
     font-size="11"
     x="360"
     y="378"
     text-anchor="middle"
     fill="#3B6D11"
     id="text1">Solo de fundação</text>
  <!-- Terreno natural (lado esquerdo — mais alto, será escavado) -->
  <!-- Poligono do terreno remanescente esquerdo: vai da borda até a crista -->
  <polygon
     points="0,100 104,133 220,210 220,350 0,350"
     fill="#97C459"
     fill-opacity="0.38"
     stroke="#639922"
     stroke-width="1"
     id="polygon1" />
  <!-- Terreno natural (lado direito — mais baixo, abaixo do aterro) -->
  <!-- Região do terreno natural à direita, abaixo do talude de aterro -->
  <polygon
     points="595,290 720,330 720,350 480,350 480,210 595,290"
     fill="#97C459"
     fill-opacity="0.38"
     stroke="#639922"
     stroke-width="1"
     id="polygon2" />
  <!-- Material de aterro (lado direito — preenchimento) -->
  <polygon
     points="595,350 480,350 480,210 595,290 "
     fill="#ef9f27"
     fill-opacity="0.38"
     stroke="#ba7517"
     stroke-width="1"
     id="polygon3"
     inkscape:transform-center-x="-6.5862469"
     inkscape:transform-center-y="-14.407649" />
  <!-- Plataforma (superfície horizontal central) -->
  <rect
     x="220"
     y="210"
     width="260"
     height="140"
     fill="#97C459"
     fill-opacity="0.25"
     stroke="none"
     id="rect3" />
  <line
     x1="220"
     y1="210"
     x2="480"
     y2="210"
     stroke="#3B6D11"
     stroke-width="2.5"
     id="line3" />
  <!-- Face do talude de corte (esquerda) -->
  <line
     x1="104"
     y1="133"
     x2="220"
     y2="210"
     stroke="#3B6D11"
     stroke-width="3"
     id="line4" />
  <!-- Face do talude de aterro (direita) -->
  <line
     x1="480"
     y1="210"
     x2="595"
     y2="290"
     stroke="#854F0B"
     stroke-width="3"
     id="line5" />
  <!-- Linha do terreno natural (tracejada, contínua) -->
  <line
     x1="0"
     y1="100"
     x2="104"
     y2="133"
     stroke="#3B6D11"
     stroke-width="2"
     id="line6" />
  <line
     x1="104"
     y1="133"
     x2="595"
     y2="290"
     stroke="#888780"
     stroke-width="1.5"
     stroke-dasharray="10 5"
     id="line7" />
  <line
     x1="595"
     y1="290"
     x2="720"
     y2="330"
     stroke="#3B6D11"
     stroke-width="2"
     id="line8" />
  <!-- Rótulo da linha de terreno natural -->
  <text
     font-family="sans-serif"
     font-size="11px"
     x="457.82404"
     y="105.90539"
     text-anchor="middle"
     fill="#888780"
     transform="rotate(18)"
     id="text8">Terreno natural original</text>
  <!-- ===== ANOTAÇÕES ===== -->
  <!-- Crista do corte -->
  <circle
     cx="104"
     cy="133"
     r="5"
     fill="#3B6D11"
     id="circle8" />
  <text
     font-family="sans-serif"
     font-size="12px"
     font-weight="500"
     x="100"
     y="123"
     text-anchor="middle"
     fill="#3b6d11"
     id="text9">Crista</text>
  <text
     font-family="sans-serif"
     font-size="11px"
     x="134.67012"
     y="121.99353"
     text-anchor="middle"
     fill="#888780"
     id="text10">(corte)</text>
  <!-- Pé do aterro -->
  <circle
     cx="595"
     cy="290"
     r="5"
     fill="#854F0B"
     id="circle10" />
  <text
     font-family="sans-serif"
     font-size="12px"
     font-weight="500"
     x="604.6507"
     y="290.17465"
     fill="#854f0b"
     id="text11">Pé</text>
  <text
     font-family="sans-serif"
     font-size="11px"
     x="621.93658"
     y="289.75549"
     fill="#888780"
     id="text12">(aterro)</text>
  <!-- Linha de terra (esquerda) — onde o greide cruza o terreno no lado do corte -->
  <circle
     cx="220"
     cy="210"
     r="5"
     fill="#3B6D11"
     id="circle12" />
  <text
     font-family="sans-serif"
     font-size="11"
     x="216"
     y="200"
     text-anchor="end"
     fill="#3B6D11"
     id="text13">LT</text>
  <!-- Linha de terra (direita) — onde o greide cruza o terreno no lado do aterro -->
  <circle
     cx="480"
     cy="210"
     r="5"
     fill="#854F0B"
     id="circle13" />
  <text
     font-family="sans-serif"
     font-size="11"
     x="484"
     y="200"
     fill="#854F0B"
     id="text14">LT</text>
  <!-- Legenda LT -->
  <text
     font-family="sans-serif"
     font-size="10px"
     x="354.75674"
     y="170.7278"
     text-anchor="middle"
     fill="#555555"
     id="text15">LT = Linha de terra</text>
  <!-- H do corte -->
  <line
     x1="155"
     y1="135"
     x2="155"
     y2="208"
     stroke="#378ADD"
     stroke-width="1.5"
     marker-start="url(#arr)"
     marker-end="url(#arr)"
     id="line15" />
  <text
     font-family="sans-serif"
     font-size="13"
     font-style="italic"
     font-weight="bold"
     x="142"
     y="178"
     text-anchor="end"
     fill="#185FA5"
     id="text16">H</text>
  <text
     font-family="sans-serif"
     font-size="10"
     x="142"
     y="190"
     text-anchor="end"
     fill="#185FA5"
     id="text17">corte</text>
  <!-- H do aterro -->
  <line
     x1="555"
     y1="212"
     x2="555"
     y2="288"
     stroke="#378ADD"
     stroke-width="1.5"
     marker-start="url(#arr)"
     marker-end="url(#arr)"
     id="line17" />
  <text
     font-family="sans-serif"
     font-size="13"
     font-style="italic"
     font-weight="bold"
     x="568"
     y="255"
     fill="#185FA5"
     id="text18">H</text>
  <text
     font-family="sans-serif"
     font-size="10"
     x="568"
     y="267"
     fill="#185FA5"
     id="text19">aterro</text>
  <!-- Ângulo β corte no pé esquerdo (220,210) -->
  <path
     d="M 172,210 A 48,48 0 0,0 181,184"
     fill="none"
     stroke="#D85A30"
     stroke-width="1.5"
     id="path19" />
  <text
     font-family="sans-serif"
     font-size="13"
     font-style="italic"
     x="157"
     y="204"
     fill="#993C1D"
     id="text20">β</text>
  <!-- Ângulo β aterro no crista direita (480,210) -->
  <path
     d="M 528,210 A 48,48 0 0,1 519,236"
     fill="none"
     stroke="#D85A30"
     stroke-width="1.5"
     id="path20" />
  <text
     font-family="sans-serif"
     font-size="13"
     font-style="italic"
     x="532"
     y="228"
     fill="#993C1D"
     id="text21">β</text>
  <!-- Rótulo Talude de corte -->
  <text
     font-family="sans-serif"
     font-size="12px"
     font-weight="500"
     x="187.93123"
     y="132.81104"
     text-anchor="middle"
     fill="#3b6d11"
     id="text22">Talude</text>
  <text
     font-family="sans-serif"
     font-size="12px"
     font-weight="500"
     x="187.93123"
     y="147.81104"
     text-anchor="middle"
     fill="#3b6d11"
     id="text23">de corte</text>
  <!-- Rótulo Talude de aterro -->
  <text
     font-family="sans-serif"
     font-size="12px"
     font-weight="500"
     x="545.93011"
     y="188.21216"
     text-anchor="middle"
     fill="#854f0b"
     id="text24">Talude</text>
  <text
     font-family="sans-serif"
     font-size="12px"
     font-weight="500"
     x="545.93011"
     y="202.21216"
     text-anchor="middle"
     fill="#854f0b"
     id="text25">de aterro</text>
  <!-- Rótulo Plataforma -->
  <text
     font-family="sans-serif"
     font-size="13"
     font-weight="500"
     x="350"
     y="280"
     text-anchor="middle"
     fill="#3B6D11"
     id="text26">Plataforma</text>
  <!-- Rótulos laterais -->
  <text
     font-family="sans-serif"
     font-size="11"
     x="30"
     y="160"
     text-anchor="middle"
     fill="#3B6D11"
     id="text27">Encosta</text>
  <text
     font-family="sans-serif"
     font-size="11"
     x="690"
     y="310"
     text-anchor="middle"
     fill="#3B6D11"
     id="text28">Vale</text>
</svg>
