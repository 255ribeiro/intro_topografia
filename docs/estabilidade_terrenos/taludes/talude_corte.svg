  <line
     x1="0"
     y1="90"
     x2="120"
     y2="90"
     stroke="#3B6D11"
     stroke-width="2"
     id="line3" />
  <!-- Nível original do terreno (tracejado) -->
  <line
     x1="120"
     y1="90"
     x2="590"
     y2="90"
     stroke="#888780"
     stroke-width="1.5"
     stroke-dasharray="10 5"
