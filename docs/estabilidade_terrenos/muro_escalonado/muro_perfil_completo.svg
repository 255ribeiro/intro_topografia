<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg">
  <title>Muro de gravidade com face externa vertical e interna escalonada</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  
  <!-- Solo de fundação -->
  <rect x="40" y="440" width="600" height="80" fill="#97C459" fill-opacity="0.25" stroke="#639922" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="485" text-anchor="middle" fill="#3B6D11">Solo de fundação</text>
  
  <!-- Terreno natural do lado livre -->
  <rect x="40" y="380" width="130" height="60" fill="#97C459" fill-opacity="0.35" stroke="#639922" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="11" x="105" y="408" text-anchor="middle" fill="#3B6D11">Terreno</text>
  <text font-family="sans-serif" font-size="11" x="105" y="422" text-anchor="middle" fill="#3B6D11">natural</text>
  
  <!-- Solo retido em camadas encostando nos degraus -->
  <rect x="390" y="380" width="230" height="60" fill="#EF9F27" fill-opacity="0.35" stroke="#BA7517" stroke-width="0.5"/>
  <rect x="370" y="320" width="250" height="60" fill="#EF9F27" fill-opacity="0.35" stroke="#BA7517" stroke-width="0.5"/>
  <rect x="350" y="260" width="270" height="60" fill="#EF9F27" fill-opacity="0.35" stroke="#BA7517" stroke-width="0.5"/>
  <rect x="330" y="200" width="290" height="60" fill="#EF9F27" fill-opacity="0.35" stroke="#BA7517" stroke-width="0.5"/>
  <rect x="310" y="140" width="310" height="60" fill="#EF9F27" fill-opacity="0.35" stroke="#BA7517" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" x="480" y="265" text-anchor="middle" fill="#854F0B">Solo retido</text>
  <text font-family="sans-serif" font-size="11" x="480" y="280" text-anchor="middle" fill="#854F0B">compactado</text>
  
  <!-- Estrutura do muro -->
  <!-- Base com calcanhar avançando para o lado livre -->
  <rect x="170" y="380" width="220" height="60" rx="4" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1"/>
  <rect x="220" y="320" width="150" height="60" rx="4" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1"/>
  <rect x="220" y="260" width="130" height="60" rx="4" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1"/>
  <rect x="220" y="200" width="110" height="60" rx="4" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1"/>
  <rect x="220" y="140" width="90" height="60" rx="4" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" x="280" y="275" text-anchor="middle" fill="#2C2C2A">Concreto</text>
  
  <!-- Indicação do calcanhar -->
  <text font-family="sans-serif" font-size="10" x="195" y="398" text-anchor="middle" fill="#2C2C2A">Calcanhar</text>
  
  <!-- Face externa vertical (linha de referência) -->
  <line x1="220" y1="140" x2="220" y2="440" stroke="#378ADD" stroke-width="2" opacity="0.6"/>
  <text font-family="sans-serif" font-size="11" x="205" y="250" text-anchor="end" fill="#378ADD">Face externa</text>
  <text font-family="sans-serif" font-size="11" x="205" y="263" text-anchor="end" fill="#378ADD">vertical</text>
  
  <!-- Linhas de nível -->
  <line x1="220" y1="140" x2="640" y2="140" stroke="#888780" stroke-width="2" stroke-dasharray="8 4" opacity="0.5"/>
  <text font-family="sans-serif" font-size="11" x="560" y="130" text-anchor="middle" fill="#888780">Nível do terreno retido</text>
  
  <line x1="40" y1="440" x2="640" y2="440" stroke="#888780" stroke-width="2" stroke-dasharray="8 4" opacity="0.4"/>
  <text font-family="sans-serif" font-size="11" x="540" y="458" text-anchor="middle" fill="#888780">Nível da fundação</text>
  
  <!-- Setas de empuxo ativo -->
  <line x1="390" y1="170" x2="320" y2="170" stroke="#D85A30" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="230" x2="340" y2="230" stroke="#D85A30" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="290" x2="360" y2="290" stroke="#D85A30" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="350" x2="400" y2="350" stroke="#D85A30" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="410" x2="400" y2="410" stroke="#D85A30" stroke-width="2" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="11" x="430" y="300" text-anchor="middle" fill="#993C1D">Empuxo ativo</text>
  
  <!-- Peso próprio -->
  <line x1="285" y1="95" x2="285" y2="130" stroke="#378ADD" stroke-width="3" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="11" x="295" y="110" text-anchor="start" fill="#185FA5">Peso próprio</text>
  
  <!-- Reação do solo -->
  <line x1="240" y1="460" x2="240" y2="450" stroke="#639922" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="305" y1="460" x2="305" y2="450" stroke="#639922" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="460" x2="370" y2="450" stroke="#639922" stroke-width="2" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="11" x="270" y="476" text-anchor="middle" fill="#3B6D11">Reação do solo</text>
  
  <!-- Empuxo passivo -->
  <line x1="150" y1="410" x2="160" y2="410" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="10" x="80" y="405" text-anchor="end" fill="#0F6E56">Empuxo</text>
  <text font-family="sans-serif" font-size="10" x="80" y="418" text-anchor="end" fill="#0F6E56">passivo</text>
</svg>
